name: Publish @gantstreet/rastrata-plugin-sdk

on:
  push:
    tags:
      - "plugin-sdk-v*"

permissions: {}

concurrency:
  group: publish-plugin-sdk-${{ github.ref }}
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: bun ci
      - name: Verify release tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#plugin-sdk-v}"
          PKG_VERSION="$(node -p "require('./packages/plugin-sdk/package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match packages/plugin-sdk/package.json version $PKG_VERSION"
            exit 1
          fi
      - run: bun run --cwd packages/plugin-sdk typecheck
      - run: bun run --cwd packages/plugin-sdk test
      - run: bun run --cwd packages/plugin-sdk prepare:publish
      - name: Publish to npm via OIDC Trusted Publishing with provenance
        working-directory: packages/plugin-sdk/.publish
        run: npm publish --provenance --access public
